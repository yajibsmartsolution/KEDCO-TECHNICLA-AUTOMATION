services:
  - type: web
    name: kedco-local-backend
    runtime: node
    plan: free

    rootDir: backend

    buildCommand: npm install && npm run build

    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 22.12.0

      - key: CORS_ORIGIN
        sync: false
