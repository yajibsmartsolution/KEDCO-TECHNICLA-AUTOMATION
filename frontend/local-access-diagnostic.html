<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEDCO Local Access Diagnostic</title><style>body{font:15px Arial;background:#071827;color:#eaf5ff;padding:24px}button,a{display:inline-block;margin:5px;padding:10px 14px;border-radius:8px;background:#0e6383;color:white;text-decoration:none;border:0}.ok{color:#66e39d}.bad{color:#ff8b8b}pre{white-space:pre-wrap;background:#03111d;padding:14px;border-radius:10px}</style><script src="supabase-config.js"></script><script src="assets/supabase.js"></script><script src="kedco-page-routes.js"></script></head><body><h1>KEDCO Local Storage Access Diagnostic</h1><p id="summary">Running checks…</p><pre id="out"></pre><p><a href="./index.html">Open Login</a> <a href="./pages/developer/dev.html">Developer Page</a> <a href="./pages/system-operations/dispatch.html">Dispatch</a> <a href="./pages/system-operations/operator.html">Operator</a></p><script>(async()=>{const o=document.getElementById('out'),s=document.getElementById('summary'),lines=[];try{const h=await fetch('/health').then(r=>r.json());lines.push('Backend: '+(h.ok?'OK':'FAILED')+' | storage='+h.storage_mode)}catch(e){lines.push('Backend: FAILED '+e.message)}try{const c=window.supabase.createClient();const {data}=await c.auth.getSession();lines.push('Browser session: '+(data.session?'PRESENT':'NOT SIGNED IN'));if(data.session){const me=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+data.session.access_token}});lines.push('Session validation: '+me.status+' '+await me.text())}}catch(e){lines.push('Session check: FAILED '+e.message)}let good=0,bad=0;for(const [role,route] of Object.entries(window.KEDCO_PAGE_ROUTES||{})){try{const u=new URL(route,location.href);const r=await fetch(u,{cache:'no-store'});if(r.ok)good++;else{bad++;lines.push(role+' -> '+route+' HTTP '+r.status)}}catch(e){bad++;lines.push(role+' -> '+route+' ERROR '+e.message)}}lines.push('Role landing routes: '+good+' OK, '+bad+' failed');o.textContent=lines.join('\n');s.className=bad?'bad':'ok';s.textContent=bad?'Some checks failed.':'Local page access checks passed.'})()</script></body></html>
